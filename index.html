<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dawa Info · தவா இன்போ</title>
<style>
:root {
  --bg: #e8f5f2;
  --bg2: #f0fdfa;
  --card: rgba(255,255,255,0.72);
  --card-solid: #ffffff;
  --text: #134e4a;
  --muted: #5b7c78;
  --primary: #0d9488;
  --primary-d: #0f766e;
  --accent: #14b8a6;
  --danger: #ef4444;
  --warn: #f59e0b;
  --ok: #22c55e;
  --border: rgba(13,148,136,0.18);
  --shadow: 0 8px 32px rgba(13,148,136,0.12);
  --nav-h: 64px;
  --glass: blur(16px);
}
[data-theme="dark"] {
  --bg: #0b1413;
  --bg2: #111f1d;
  --card: rgba(22,40,38,0.78);
  --card-solid: #162826;
  --text: #e0f2f1;
  --muted: #8fb5b0;
  --primary: #2dd4bf;
  --primary-d: #5eead4;
  --accent: #14b8a6;
  --border: rgba(45,212,191,0.15);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  background: linear-gradient(165deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
  color: var(--text); min-height: 100vh; padding-bottom: calc(var(--nav-h) + 20px);
  line-height: 1.5; transition: background .3s, color .3s;
}
.app{max-width:480px;margin:0 auto;padding:12px}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 12px}
.hdr h1{font-size:1.25rem;color:var(--primary-d);font-weight:700}
.hdr-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);backdrop-filter:var(--glass);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;color:var(--text);
}
/* Search */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{
  width:100%;padding:14px 48px 14px 16px;border:2px solid var(--border);border-radius:16px;
  background:var(--card);backdrop-filter:var(--glass);color:var(--text);font-size:1rem;outline:none;
}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.2)}
.search-wrap .sbtn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border:0;border-radius:12px;background:var(--primary);color:#fff;
  font-size:1.1rem;cursor:pointer;
}
/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap;
}
.chip:active,.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Cards */
.card{
  background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--border);
  border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
  transition: transform .15s;
}
.card:active{transform:scale(.98)}
.card-title{font-size:1.05rem;font-weight:650;color:var(--primary-d);margin-bottom:4px}
.card-sub{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:600;
  background:rgba(13,148,136,.12);color:var(--primary-d);
}
.badge.rx{background:rgba(239,68,68,.12);color:#ef4444}
.badge.otc{background:rgba(34,197,94,.12);color:#16a34a}
.score-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
/* Detail overlay */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex}
.sheet{
  background:var(--card-solid);width:100%;max-width:480px;max-height:92vh;
  border-radius:24px 24px 0 0;overflow-y:auto;padding:20px 16px 40px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
.sheet h2{font-size:1.2rem;color:var(--primary-d);margin-bottom:4px}
.close-btn{
  position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);font-size:1.2rem;cursor:pointer;color:var(--text);
}
.section{margin-top:18px}
.section h3{
  font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.section p,.section .box{
  font-size:.9rem;background:var(--bg2);padding:12px;border-radius:12px;color:var(--text);
}
.safety-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.safety-item{
  background:var(--bg2);padding:10px 12px;border-radius:12px;font-size:.82rem;
  display:flex;flex-direction:column;gap:4px;
}
.safety-item .label{color:var(--muted);font-size:.72rem}
.safety-item .val{font-weight:600}
.risk-g{color:#16a34a}.risk-y{color:#d97706}.risk-r{color:#dc2626}
/* Compare */
.compare-bar{
  display:none;position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;
  padding:10px 14px;border-radius:14px;margin-bottom:12px;font-size:.9rem;
  align-items:center;justify-content:space-between;gap:8px;
}
.compare-bar.show{display:flex}
/* Bottom nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:var(--card-solid);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;z-index:90;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav button{
  flex:1;border:0;background:transparent;color:var(--muted);font-size:.62rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;cursor:pointer;
}
.bnav button.on{color:var(--primary)}
.bnav button span{font-size:1.25rem}
/* Pages */
.page{display:none}
.page.on{display:block}
/* Skeleton */
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px;height:80px;margin-bottom:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Fav */
.fav-btn{background:none;border:0;font-size:1.3rem;cursor:pointer;padding:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty span{font-size:2.5rem;display:block;margin-bottom:8px}
/* Lang select small */
.lang-sel{
  padding:6px 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.75rem;max-width:110px;
}
.explain{
  background:linear-gradient(135deg,rgba(13,148,136,.1),rgba(20,184,166,.08));
  border-left:3px solid var(--primary);padding:12px;border-radius:0 12px 12px 0;
  font-size:.88rem;margin-top:8px;
}
.cmp-table{width:100%;border-collapse:collapse;font-size:.85rem}
.cmp-table th,.cmp-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.cmp-table th{color:var(--muted);font-weight:600;width:30%}
.star{color:#f59e0b}
.row-actions{display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;
}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.danger{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.3)}
.status{text-align:center;padding:12px;font-size:.9rem;color:var(--muted)}

.lang-opt{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:14px;margin-bottom:6px;
  background:var(--bg2);border:1px solid transparent;cursor:pointer;
  font-size:1rem;color:var(--text);
}
.lang-opt:active{transform:scale(.98)}
.lang-opt.on{border-color:var(--primary);background:rgba(13,148,136,.12)}
.lang-opt .check{color:var(--primary);font-weight:700}
.lang-sel{
  padding:8px 12px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;
  max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

</style>
</head>

<div class="app">
  <!-- SEARCH PAGE -->
  <div id="page-search" class="page on">
    <div class="hdr">
      <h1 id="appTitle">💊 Dawa Info</h1>
      <div class="hdr-actions">
        <button type="button" class="lang-sel" id="langBtn" onclick="openLangPicker()">English ▾</button>
        <select id="lang" style="display:none">

          <option value="hi">हिन्दी</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option value="ml">മലയാളം</option>
          <option value="kn">ಕನ್ನಡ</option>
          <option value="bn">বাংলা</option>
          <option value="mr">मराठी</option>
          <option value="gu">ગુજરાતી</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
        </select>
        <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌓</button>
      </div>
    </div>
    <div class="search-wrap">

    </div>

    </div>
    <div id="status" class="status"></div>
    <div id="results"></div>
  </div>

  <!-- FAVORITES PAGE -->
  <div id="page-fav" class="page">

    <div id="favList"></div>
  </div>

  <!-- RECENT PAGE -->

  </div>

        <option value="after">After food</option>
        <option value="with">With food</option>
      </select>
      <div id="remFoodMinBox" style="display:none;margin-bottom:10px">
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:6px" id="remLblMin">Minutes</div>

          <option value="20">20 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
        </select>

      <div style="font-size:.8rem;color:var(--muted);margin:4px 0 6px" id="remLblNote">Note (optional)</div>

      <p style="font-size:.72rem;color:var(--muted);margin-top:10px;text-align:center" id="remHint">Works best while app is open. Allow notifications when asked.</p>

    <div id="remList" style="margin-top:8px"></div>

</div>

</nav>

  if(l==="Yellow") return "risk-y";
  return "risk-r";
}

/* ========== PARSE COMPOSITION ========== */
function parseIngredients(comp){
  if(!comp) return [];
  const parts = comp.split(/\+|,|\//).map(s=>s.trim()).filter(Boolean);
  const found = [];
  for(const p of parts){
    const low = p.toLowerCase();
    for(const key of Object.keys(ING)){
      if(low.includes(key) && !found.find(f=>f.key===key)){
        found.push({key, info:ING[key], raw:p});
      }
    }
  }
  return found;
}

function overallRisk(ings){
  if(!ings.length) return "Yellow";
  if(ings.some(i=>i.info.pregnancy.l==="Red"||i.info.liver.l==="Red"||i.info.kidney.l==="Red")) return "Red";
  if(ings.some(i=>i.info.pregnancy.l==="Yellow"||i.info.alcohol.l==="Yellow")) return "Yellow";
  return "Green";
}

function isRx(ings, med){
  if(ings.some(i=>i.info.rx)) return true;
  return false;
}

function findAlternatives(med, limit=5){
  const comp = (med.c||"").toLowerCase();
  // primary salt
  let primary = "";
  for(const k of Object.keys(ING)){
    if(comp.includes(k)){ primary=k; break; }
  }
  if(!primary) return [];
  const alts = [];
  for(const m of M){
    if(m.n===med.n) continue;
    if((m.c||"").toLowerCase().includes(primary)){
      alts.push(m);
      if(alts.length>=limit) break;
    }
  }
  return alts;
}

/* ========== RENDER CARD ========== */
function renderCard(med, opts={}){
  const ings = parseIngredients(med.c);
  const rx = isRx(ings, med);
  const risk = overallRisk(ings);
  const isFav = favs.includes(med.n);
  const inCmp = cmpSel.includes(med.n);
  return `<div class="card" onclick="openDetail('${escAttr(med.n)}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <div class="card-title">${esc(med.n)}</div>
        <div class="card-sub">${esc(med.m||"")}</div>
      </div>
      <button class="fav-btn" onclick="event.stopPropagation();toggleFav('${escAttr(med.n)}')">${isFav?"❤️":"🤍"}</button>
    </div>
    <div class="badges">
      <span class="badge">${riskEmoji(risk)} ${risk}</span>
      <span class="badge ${rx?"rx":"otc"}">${rx?"Rx":"OTC"}</span>
      ${med.p?`<span class="badge">₹${esc(med.p)}</span>`:""}
    </div>
    <div class="row-actions">
      <button class="btn" onclick="event.stopPropagation();openDetail('${escAttr(med.n)}')">Details</button>
      <button class="btn ${inCmp?"primary":""}" onclick="event.stopPropagation();toggleCmp('${escAttr(med.n)}')">⚖️</button>
    </div>
  </div>`;
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){
  return String(s||"").replace(/'/g, "\\'");
}

    </div>

    <div class="row-actions" style="margin-top:20px">
      <button class="btn primary" onclick="toggleFav('${escAttr(med.n)}');openDetail('${escAttr(med.n)}')">${favs.includes(med.n)?"❤️ "+t("favRem"):"🤍 "+t("favAdd")}</button>
      <button class="btn" onclick="toggleCmp('${escAttr(med.n)}')">${t("addCmp")}</button>
    </div>
    <p style="font-size:.75rem;color:var(--muted);margin-top:16px;text-align:center">⚠️ Not medical advice. Always consult a doctor or pharmacist.</p>
  `;
  document.getElementById("detailOverlay").classList.add("show");
}

function closeDetail(){
  document.getElementById("detailOverlay").classList.remove("show");
}

/* ========== SEARCH ========== */
function doSearch(){
  const q = (document.getElementById("q").value||"").toLowerCase().replace(/\s+/g," ").trim();
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  if(q.length<2){
    status.textContent = t("ready",{n:M.length.toLocaleString()});
    results.innerHTML = "";
    return;
  }
  status.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  results.innerHTML = "";
  setTimeout(()=>{
    const hits = [];
    for(const m of M){
      const n = m.n.toLowerCase();
      if(n.includes(q)){
        let sc = n.startsWith(q)?100:(n.includes(" "+q)?80:50-Math.min(n.indexOf(q),40));
        sc -= Math.min(n.length/20,8);
        hits.push({m,sc});
      }
    }
    hits.sort((a,b)=>b.sc-a.sc);
    const top = hits.slice(0,20);
    if(!top.length){
      status.textContent = t("noRes",{q:document.getElementById("q").value});
      return;
    }
    status.textContent = t("results",{n:top.length+(hits.length>20?"+":"")});
    results.innerHTML = top.map(h=>renderCard(h.m)).join("");
    addRecentQuery(document.getElementById("q").value.trim());
  }, 180);
}

function addRecent(name){
  recent = [name, ...recent.filter(x=>x!==name)].slice(0,30);
  safeSet("medRecent", recent);
}
function addRecentQuery(q){
  if(!q) return;
  let rq = safeGet("medRecentQ", []);
  rq = [q, ...rq.filter(x=>x!==q)].slice(0,10);
  safeSet("medRecentQ", rq);
  renderRecentChips();
}
function renderRecentChips(){
  const rq = safeGet("medRecentQ", []);
  const el = document.getElementById("recentChips");
  if(!rq.length){ el.innerHTML=""; return; }
  el.innerHTML = rq.map(q=>`<span class="chip" onclick="document.getElementById('q').value='${escAttr(q)}';doSearch()">${esc(q)}</span>`).join("");
}

/* ========== FAV / CMP ========== */
function toggleFav(name){
  if(favs.includes(name)) favs = favs.filter(x=>x!==name);
  else favs = [name, ...favs].slice(0,50);
  safeSet("medFavs", favs);
  // refresh visible lists
  if(document.getElementById("page-fav").classList.contains("on")) renderFavs();
  doSearch();
}
function toggleCmp(name){
  if(cmpSel.includes(name)) cmpSel = cmpSel.filter(x=>x!==name);
  else {
    if(cmpSel.length>=2) cmpSel = [cmpSel[1], name];
    else cmpSel.push(name);
  }
  updateCmpBar();
  doSearch();
}
function updateCmpBar(){
  const bar = document.getElementById("compareBar");
  if(cmpSel.length){
    bar.classList.add("show");
    document.getElementById("cmpLabel").textContent = cmpSel.join(" vs ") + (cmpSel.length<2?" (pick 1 more)":"");
  } else bar.classList.remove("show");
}
function clearCompare(){ cmpSel=[]; updateCmpBar(); doSearch(); }
function runCompare(){
  if(cmpSel.length<2){ alert(t("select2")); return; }
  navTo("compare");
  // sync picks to compare page inputs
  document.getElementById("cmpPick1").textContent = cmpSel[0] || "";
  document.getElementById("cmpPick2").textContent = cmpSel[1] || "";
  document.getElementById("cmpQ1").value = "";
  document.getElementById("cmpQ2").value = "";
  document.getElementById("cmpSug1").innerHTML = "";
  document.getElementById("cmpSug2").innerHTML = "";
  renderCompare();
}

function cmpSuggest(which){
  const q = (document.getElementById("cmpQ"+which).value||"").toLowerCase().replace(/\s+/g," ").trim();
  const box = document.getElementById("cmpSug"+which);
  if(q.length<2){ box.innerHTML=""; return; }
  const hits = [];
  for(const m of M){
    const n = m.n.toLowerCase();
    if(n.includes(q)){
      let sc = n.startsWith(q)?100:50;
      hits.push({m,sc});
    }
  }
  hits.sort((a,b)=>b.sc-a.sc);
  const top = hits.slice(0,8);
  box.innerHTML = top.map(h=>`<div style="padding:10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.88rem" onclick="cmpPick(${which},'${escAttr(h.m.n)}')"><strong>${esc(h.m.n)}</strong><br><span style="color:var(--muted);font-size:.75rem">${esc(h.m.m||"")} · ₹${esc(h.m.p||"—")}</span></div>`).join("") || `<div style="padding:8px;color:var(--muted);font-size:.85rem">No match</div>`;
}

function cmpPick(which, name){
  document.getElementById("cmpPick"+which).textContent = name;
  document.getElementById("cmpQ"+which).value = "";
  document.getElementById("cmpSug"+which).innerHTML = "";
  if(which===1){
    if(cmpSel.length===0) cmpSel=[name];
    else cmpSel[0]=name;
  } else {
    if(cmpSel.length===0) cmpSel=["", name];
    else if(cmpSel.length===1) cmpSel.push(name);
    else cmpSel[1]=name;
  }
  // clean empty
  cmpSel = cmpSel.filter(Boolean).slice(0,2);
  updateCmpBar();
}

function runCompareFromSelect(){
  const a = document.getElementById("cmpPick1").textContent.trim();
  const b = document.getElementById("cmpPick2").textContent.trim();
  if(!a || !b){ alert(t("select2")); return; }
  cmpSel = [a,b];
  updateCmpBar();
  renderCompare();
}

function renderCompare(){
  const a = M.find(m=>m.n===cmpSel[0]);
  const b = M.find(m=>m.n===cmpSel[1]);
  if(!a||!b){ document.getElementById("compareResult").innerHTML='<div class="empty"><span>⚖️</span>'+t("select2")+'</div>'; return; }
  const ia = parseIngredients(a.c);
  const ib = parseIngredients(b.c);
  const pa = ia[0]?ia[0].info:null;
  const pb = ib[0]?ib[0].info:null;
  const rows = [
    [t("brand"), a.n, b.n],
    [t("generic"), pa?pa.generic:a.c, pb?pb.generic:b.c],
    [t("composition"), a.c, b.c],
    [t("manufacturer"), a.m, b.m],
    [t("price"), a.p?"₹"+a.p:"—", b.p?"₹"+b.p:"—"],
    [t("pack"), a.k||"—", b.k||"—"],
    [t("uses"), pa?pa.uses:(a.u||"—"), pb?pb.uses:(b.u||"—")],
    [t("side"), pa?pa.side:(a.s||"—"), pb?pb.side:(b.s||"—")],
    [t("pregnancy"), pa?riskEmoji(pa.pregnancy.l)+" "+pa.pregnancy.t:"—", pb?riskEmoji(pb.pregnancy.l)+" "+pb.pregnancy.t:"—"],
    [t("alcohol"), pa?riskEmoji(pa.alcohol.l)+" "+pa.alcohol.t:"—", pb?riskEmoji(pb.alcohol.l)+" "+pb.alcohol.t:"—"],
    [t("liver"), pa?riskEmoji(pa.liver.l)+" "+pa.liver.t:"—", pb?riskEmoji(pb.liver.l)+" "+pb.liver.t:"—"],
    [t("kidney"), pa?riskEmoji(pa.kidney.l)+" "+pa.kidney.t:"—", pb?riskEmoji(pb.kidney.l)+" "+pb.kidney.t:"—"],
  ];
  document.getElementById("compareResult").innerHTML = `
    <div class="card">
      <h2 style="font-size:1.1rem;margin-bottom:12px">${t("cmpTitle")}</h2>
      <table class="cmp-table">
        <thead><tr><th></th><th>${esc(a.n)}</th><th>${esc(b.n)}</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function renderFavs(){
  const el = document.getElementById("favList");
  if(!favs.length){ el.innerHTML='<div class="empty"><span>❤️</span>'+t("emptyFav")+'</div>'; return; }
  el.innerHTML = favs.map(n=>{
    const m = M.find(x=>x.n===n);
    return m?renderCard(m):"";
  }).join("");
}
function renderRecent(){
  const el = document.getElementById("recentList");
  if(!recent.length){ el.innerHTML='<div class="empty"><span>🕐</span>'+t("emptyRecent")+'</div>'; return; }
  el.innerHTML = recent.map(n=>{
    const m = M.find(x=>x.n===n);
    return m?renderCard(m):"";
  }).join("");
}

/* ========== NAV ========== */
function navTo(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  document.getElementById("page-"+page).classList.add("on");
  document.querySelectorAll(".bnav button").forEach(b=>{
    b.classList.toggle("on", b.dataset.page===page);
  });
  if(page==="fav") renderFavs();
  if(page==="recent") renderRecent();
  if(page==="remind"){ remFreqChange(); renderReminders(); tryRequestNotif(); }
  if(page==="compare"){
    // keep existing picks visible; only render table if 2 selected
    if(cmpSel.length>=2){
      document.getElementById("cmpPick1").textContent = cmpSel[0];
      document.getElementById("cmpPick2").textContent = cmpSel[1];
      renderCompare();
    } else {
      document.getElementById("compareResult").innerHTML = "";
    }
  }
}


/* ========== REMINDERS ========== */
let reminders = safeGet("medReminders", []);
let remPickName = "";

function remSuggest(){
  const q = (document.getElementById("remQ").value||"").toLowerCase().replace(/\s+/g," ").trim();
  const box = document.getElementById("remSug");
  if(q.length<2){ box.innerHTML=""; return; }
  const hits = [];
  for(const m of M){
    const n = m.n.toLowerCase();
    if(n.includes(q)) hits.push({m, sc: n.startsWith(q)?100:50});
  }
  hits.sort((a,b)=>b.sc-a.sc);
  box.innerHTML = hits.slice(0,6).map(h=>`<div style="padding:10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.88rem" onclick="remPickMed('${escAttr(h.m.n)}')"><strong>${esc(h.m.n)}</strong></div>`).join("") || "";
}
function remPickMed(name){
  remPickName = name;
  document.getElementById("remPick").textContent = name;
  document.getElementById("remQ").value = "";
  document.getElementById("remSug").innerHTML = "";
}
function remFreqChange(){
  const f = document.getElementById("remFreq").value;
  const box = document.getElementById("remTimeInputs");
  const dayBox = document.getElementById("remDayBox");
  const dateBox = document.getElementById("remDateBox");
  if(dayBox) dayBox.style.display = f==="weekly" ? "block" : "none";
  if(dateBox) dateBox.style.display = f==="monthly" ? "block" : "none";
  let times = ["09:00"];
  if(f==="daily2") times = ["09:00","21:00"];
  if(f==="daily3") times = ["08:00","14:00","21:00"];
  if(f.startsWith("h")) times = ["08:00"];
  if(box) box.innerHTML = times.map((t)=>`<input type="time" class="remTime" value="${t}" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:8px">`).join("");
  updateRemFreqLabels();
}
function remFoodChange(){
  const v = document.getElementById("remFood").value;
  const box = document.getElementById("remFoodMinBox");
  if(box) box.style.display = (v==="before"||v==="after") ? "block" : "none";
}
function updateRemFreqLabels(){
  const sel = document.getElementById("remFreq");
  if(!sel) return;
  const map = {daily1:"daily1",daily2:"daily2",daily3:"daily3",h3:"h3",h4:"h4",h6:"h6",h8:"h8",weekly:"weekly",monthly:"monthly"};
  Array.from(sel.options).forEach(o=>{ if(map[o.value]) o.textContent = t(map[o.value]); });
  const food = document.getElementById("remFood");
  if(food){
    const fm = {none:"foodNone",before:"foodBefore",after:"foodAfter",with:"foodWith"};
    Array.from(food.options).forEach(o=>{ if(fm[o.value]) o.textContent = t(fm[o.value]); });
  }
}
function foodText(r){
  if(!r.food || r.food==="none") return "";
  if(r.food==="with") return t("foodWith");
  if(r.food==="before") return t("minBefore",{n:r.foodMin||15});
  if(r.food==="after") return t("minAfter",{n:r.foodMin||15});
  return "";
}
function saveReminder(){
  const name = remPickName || document.getElementById("remQ").value.trim();
  if(!name){ alert(t("remMed")+"?"); return; }
  const freq = document.getElementById("remFreq").value;
  const times = Array.from(document.querySelectorAll(".remTime")).map(el=>el.value).filter(Boolean);
  if(!times.length){ alert("Time?"); return; }
  const note = document.getElementById("remNote").value.trim();
  const food = document.getElementById("remFood").value;
  const foodMin = parseInt(document.getElementById("remFoodMin").value,10)||15;
  const item = {
    id: Date.now().toString(36),
    name, freq, times, note, food, foodMin,
    weekday: parseInt(document.getElementById("remWeekday").value,10),
    monthDay: parseInt(document.getElementById("remMonthDay").value,10)||1,
    created: Date.now(),
    lastFired: {}
  };
  reminders.unshift(item);
  safeSet("medReminders", reminders);
  remPickName = "";
  document.getElementById("remPick").textContent = "";
  document.getElementById("remNote").value = "";
  renderReminders();
  tryRequestNotif();
  alert(t("remSaved"));
}
function deleteReminder(id){
  reminders = reminders.filter(r=>r.id!==id);
  safeSet("medReminders", reminders);
  renderReminders();
}
function freqLabel(f){
  const map = {daily1:"daily1",daily2:"daily2",daily3:"daily3",h3:"h3",h4:"h4",h6:"h6",h8:"h8",weekly:"weekly",monthly:"monthly"};
  return t(map[f]||f);
}
function renderReminders(){
  const el = document.getElementById("remList");
  if(!el) return;
  if(!reminders.length){
    el.innerHTML = '<div class="empty"><span>⏰</span>'+t("remNone")+'</div>';
    return;
  }
  el.innerHTML = reminders.map(r=>{
    const hasDetail = M.some(m=>m.n===r.name);
    return `<div class="card" ${hasDetail?`onclick="openDetail('${escAttr(r.name)}')"`:""} style="${hasDetail?"cursor:pointer":""}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div style="flex:1">
        <div class="card-title">${esc(r.name)}</div>
        <div class="card-sub">${esc(freqLabel(r.freq))} · ${esc((r.times||[]).join(", "))}${foodText(r)?" · "+esc(foodText(r)):""}${r.note?" · "+esc(r.note):""}</div>
        ${hasDetail?'<div style="font-size:.75rem;color:var(--primary);margin-top:6px">📋 Details →</div>':''}
      </div>
      <button class="btn danger" style="flex:0;padding:8px 12px" onclick="event.stopPropagation();deleteReminder('${r.id}')">${t("remDelete")}</button>
    </div>
  </div>`;
  }).join("");
}

function tryRequestNotif(){
  if(typeof Notification!=="undefined" && Notification.permission==="default"){
    Notification.requestPermission().catch(function(){});
  }
}
function fireNotif(title, body){
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      new Notification(title,{body:body, tag:"med-"+Date.now()});
    }
  }catch(e){}
  // in-app fallback
  try{
    const st = document.getElementById("status");
    if(st && document.getElementById("page-search").classList.contains("on")){
      st.innerHTML = '<div class="cnt">⏰ '+esc(title)+' — '+esc(body)+'</div>';
    }
  }catch(e){}
}

function checkReminders(){
  if(!reminders.length) return;
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const day = now.getDay();
  const date = now.getDate();
  const slot = now.getFullYear()+"-"+now.getMonth()+"-"+date+"-"+hm;

  reminders.forEach(r=>{
    if(!r.lastFired) r.lastFired = {};
    let should = false;
    if(r.freq==="daily1"||r.freq==="daily2"||r.freq==="daily3"){
      if((r.times||[]).includes(hm)) should = true;
    } else if(r.freq==="weekly"){
      if(day===r.weekday && (r.times||[]).includes(hm)) should = true;
    } else if(r.freq==="monthly"){
      if(date===(r.monthDay||1) && (r.times||[]).includes(hm)) should = true;
    } else if(r.freq.startsWith("h")){
      const every = parseInt(r.freq.slice(1),10)||4;
      const start = (r.times&&r.times[0]) || "08:00";
      const [sh,sm] = start.split(":").map(Number);
      const startMin = sh*60+sm;
      const curMin = now.getHours()*60+now.getMinutes();
      if(curMin>=startMin && ((curMin-startMin)% (every*60))===0) should = true;
    }
    if(should && r.lastFired[slot]!==true){
      r.lastFired[slot] = true;
      // prune old keys
      const keys = Object.keys(r.lastFired);
      if(keys.length>20) keys.slice(0,-10).forEach(k=>delete r.lastFired[k]);
      const extra = [foodText(r), r.note].filter(Boolean).join(" · ");
      fireNotif(t("takeMed"), r.name+(extra?" — "+extra:""));
    }
  });
  safeSet("medReminders", reminders);
}

/* ========== INIT ========== */

document.getElementById("q").addEventListener("keypress", e=>{ if(e.key==="Enter") doSearch(); });
document.documentElement.setAttribute("data-theme", theme==="dark"?"dark":"");
try{ document.getElementById("lang").value = lang; }catch(e){}
setLang(lang);
renderRecentChips();
updateCmpBar();
try{ remFreqChange(); renderReminders(); }catch(e){}
setInterval(checkReminders, 30000);
setTimeout(checkReminders, 2000);
</script>
